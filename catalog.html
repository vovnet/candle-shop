<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- === Базовые SEO теги === -->
    <title>Чайные свечи - Каталог</title>
    <meta
      name="description"
      content="Создаем чайные свечи ручной работы из 100% натуральных материалов. Натуральные ароматы, гипоаллергенно, идеальны для подарка и декора интерьера. Доставка по всей России."
    />
    <meta
      name="keywords"
      content="свечи ручной работы, ароматические свечи, свечи в подарок, декор для дома, чайные свечи"
    />
    <meta name="author" content="Чайные свечи" />
    <meta name="robots" content="index, follow" />

    <!-- === Цвет браузерной строки на мобильных === -->
    <meta name="theme-color" content="#d4a574" />

    <!-- === Open Graph (для Telegram, VK, WhatsApp, Facebook) === -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acfes.ru/" />
    <meta property="og:title" content="Чайные свечи ручной работы" />
    <meta
      property="og:description"
      content="Натуральные свечи, уникальные ароматы и стильный декор. Создайте уют в каждом мгновении."
    />
    <meta property="og:image" content="https://acfes.ru/assets/images/og-image.jpg" />
    <meta property="og:site_name" content="Чайные свечи" />
    <meta property="og:locale" content="ru_RU" />

    <!-- === Twitter Cards (для красивых превью в X/Twitter и некоторых мессенджерах) === -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Чайные свечи — Ароматические свечи ручной работы" />
    <meta
      name="twitter:description"
      content="Натуральные материалы, уникальные ароматы и стильный декор."
    />
    <meta name="twitter:image" content="https://acfes.ru/assets/images/og-image.jpg" />

    <!-- === Фавикон (иконка во вкладке браузера) === -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="assets/images/favicon.png" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/catalog.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <!-- Шапка рендерится через JS -->
    <div id="header-placeholder"></div>

    <main class="container">
      <h1 class="page-title">Каталог товаров</h1>
      <div id="products-grid" class="products-grid"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/pages/catalog.js"></script>
  </body>
</html>
